<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8b9eff"/>
      <stop offset="55%"  stop-color="#d77bff"/>
      <stop offset="100%" stop-color="#4dd0e1"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#1a2342"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
  </defs>
  <!-- Rounded dark square background so the icon reads on both light and dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Radio waves arching above the node, growing in intensity -->
  <path d="M5 17 Q16 4 27 17"
        fill="none" stroke="url(#g)" stroke-width="2"   stroke-linecap="round" opacity="0.55"/>
  <path d="M8 19 Q16 9 24 19"
        fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" opacity="0.78"/>
  <path d="M11 21 Q16 14.5 21 21"
        fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- The "node" (planet) at the bottom -->
  <circle cx="16" cy="24" r="3.8" fill="url(#g)"/>
  <circle cx="16" cy="24" r="1.4" fill="#ffffff" opacity="0.92"/>
</svg>
